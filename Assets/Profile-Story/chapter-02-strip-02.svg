    <style>.title{font:600 13px Georgia,serif;letter-spacing:1.7px;fill:#1A1A1A}.label{font:italic 12px Georgia,serif;fill:#1A1A1A}.tiny{font:600 9px Arial,sans-serif;letter-spacing:1px;fill:#1A1A1A}.ink{fill:none;stroke:#1A1A1A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#1A1A1A;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.gold{fill:none;stroke:#C8A96A;stroke-width:1.4;stroke-linecap:round}</style>
